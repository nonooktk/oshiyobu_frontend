# PR と、main・dev への push で回す検査（設計 D-26）。必須のチェックは verify だけ。
# 検査の中身は npm run verify（scripts/accept-lib.mjs の VERIFY_STEPS）。手元で担当者が回す検査と同じで、ここと手元がずれない。
# lint・型・整形の確認・テスト・ビルド・check:budget（--strict-images。deploy.yml と同じ）・check:csp・core:check
# （src/core/ が lock のとおりか。CI では commit が local の lock を拒否する）。
name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

# 既定は読み取りだけ。書き込みが要る job だけ、その job で上げる
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
