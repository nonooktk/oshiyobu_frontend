<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSHIYOBU 収支シミュレーター（すり合わせ用）</title>
<link rel="icon" type="image/webp" href="/assets/logo-mark.webp">
<!--
  OSHIYOBU デモ M1 モック: 収支シミュレーター（事務所との面談で、話しながら数字を書き換えて使う別ページ）
  元: 班の方が作ったページ「OSHIYOBU 会場マップ」（2026-11-12 時点の写し）。
  変えたのは表示だけ。claude.ai の公開用の枠（frame-runtime）と Google Fonts の読み込みを外し、見た目を班の「OSHIYOBU デザインシステム（toB）」の決まりに置き換えた（青・黄色の 2 色、角丸 8px、ボタンはピル型、影なし、書体は端末の日本語ゴシック）。
  計算式・会場データ・出典 URL・初期値は元のまま。<script> で変えたのは表示のテンプレート（ラベル・畳み方・札と地図の点のクラス名）だけ。
  外部通信なし（出典・公式のリンクは、押したときだけ新しいタブで開く。ロゴは assets/ の相対パス）。
-->
<style>
  /* ===== デザイントークン（toB デザインの決まり。index.html の :root と同じ値） ===== */
  :root {
    --primary: #005EBB; --primary-dark: #004C97; --sky: #00B8F0; --sky-light: #68D7FF;
    --yellow: #FBD635; --yellow-light: #FDE98C;
    --ink: #0B2A4A;        /* 本文の文字 */ --ink-soft: #2F6F9E;   /* 補助の文字。これより薄い色を文字に使わない */
    --surface: #FFFFFF; --bg-b: #F5F9FC; --bg-c: #E6F0FA;
    --line: #BFD8F1; --gray-300: #7FB7E3;   /* 線・無効・飾りだけ。文字に使わない */
    --success: #00B894; --success-ink: #007A63; --warning: #F5B400; --warning-ink: #7A5A00; --error: #E53935; --error-ink: #C62828;
    --radius: 8px; --tap: 44px;
    --font: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-b); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  a { color: var(--primary); text-decoration: underline; text-underline-offset: 2px; } a:hover { color: var(--primary-dark); }
  /* ===== 帯・ヘッダー ===== */
  .mock-banner { position: sticky; top: 0; z-index: 70; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
    min-height: var(--tap); padding: 4px 16px; background: var(--ink); color: var(--surface); font-size: 12px; font-weight: 700; text-align: center; }
  .demo-chip { padding: 0 8px; border-radius: var(--radius); background: var(--yellow); color: var(--ink); font-size: 12px; font-weight: 700; }
  .site-head { background: var(--surface); border-bottom: 1px solid var(--line); }
  .site-head-in { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; max-width: 1180px; margin: 0 auto; padding: 8px 16px; }
  .site-logo { display: block; width: auto; height: 48px; filter: brightness(1.01); } /* 画像の背景（#FDFDFD〜#FEFEFE）を白い面になじませる補正。色は 1% しか動かない */
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 32px; }
  .part-h { margin: 0 0 16px; font-size: 28px; font-weight: 700; line-height: 1.3; }

  /* ===== ボタン（Primary＝青地に白文字／Secondary＝白地に青の線と文字／Text＝青の文字だけ。ピル型） ===== */
  .btn, .chip, details.adjust > summary, details.fold-s > summary, details.fold-note > summary {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 4px 16px;
    border: 1px solid var(--primary); border-radius: 999px; background: var(--surface); color: var(--primary);
    font: inherit; font-size: 14px; font-weight: 700; line-height: 1.3; text-decoration: none; cursor: pointer; }
  .btn:hover, .chip:hover, details.adjust > summary:hover, details.fold-s > summary:hover { background: var(--bg-c); border-color: var(--primary-dark); color: var(--primary-dark); }
  .btn.primary, .chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--surface); }
  .btn.primary:hover, .chip[aria-pressed="true"]:hover { background: var(--primary-dark); border-color: var(--primary-dark); color: var(--surface); }
  .btn.sm { padding: 4px 16px; } .chip[aria-pressed="true"]::before { content: "✓"; content: "✓" / ""; }
  details.fold-note > summary { border-color: transparent; background: transparent; } details.fold-note > summary:hover { background: var(--bg-c); }
  details > summary { list-style: none; } details > summary::-webkit-details-marker { display: none; }
  details.adjust > summary::before, details.fold-s > summary::before, details.fold-note > summary::before { content: "＋"; content: "＋" / ""; }
  details[open].adjust > summary::before, details[open].fold-s > summary::before, details[open].fold-note > summary::before { content: "－"; content: "－" / ""; }
  /* ===== 外枠・タイトル行 ===== */
  .office { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .office-bar { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; padding: 16px 24px; border-bottom: 1px solid var(--line); }
  .bar-title { font-size: 16px; font-weight: 700; }
  .stats { font-size: 14px; font-weight: 700; color: var(--ink-soft); }
  .fake { margin-left: auto; padding: 0 8px; border: 1px solid var(--yellow); border-radius: var(--radius); background: var(--yellow-light); color: var(--ink); font-size: 12px; font-weight: 700; }
  /* 条件（人数・絞り込み） */
  .controls { display: grid; gap: 16px; padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--bg-b); }
  .people-row { display: flex; align-items: center; gap: 8px 24px; flex-wrap: wrap; }
  .k { font-size: 14px; font-weight: 700; color: var(--ink-soft); }
  .people { display: flex; align-items: baseline; gap: 8px; font-size: 20px; font-weight: 700; }
  #n { width: 4.6em; padding: 0 8px; border: 1px solid var(--ink-soft); border-radius: var(--radius); background: var(--surface); color: var(--primary);
    font: inherit; font-size: 28px; font-weight: 700; line-height: 1.5; font-variant-numeric: tabular-nums; }
  #nr { flex: 1; min-width: 180px; accent-color: var(--primary); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  details.adjust[open] { display: grid; gap: 16px; } details.adjust > summary { justify-self: start; }
  .frow { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
  .frow .k { min-width: 5.5em; }
  /* 地図と会場 */
  .main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .map-col { padding: 24px; border-right: 1px solid var(--line); }
  .map-wrap { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-c); overflow: hidden; }
  svg { display: block; width: 100%; height: auto; }
  .land { fill: var(--surface); stroke: var(--gray-300); stroke-width: 3.2; stroke-linejoin: round; } .inset { fill: none; stroke: var(--gray-300); stroke-width: 2; stroke-dasharray: 6 6; }
  .plab { font-family: var(--font); font-size: 30px; font-weight: 700; fill: var(--ink-soft); pointer-events: none; }
  .dot { cursor: pointer; }
  /* 丸はメインの地図と同じくらいの大きさに見えるよう、表示だけ 2 倍にする（大きさの比＝収容人数の比は元のまま） */
  .dot circle { stroke: var(--surface); stroke-width: 2; transform-box: fill-box; transform-origin: center; transform: scale(2); }
  .dot circle.dim { fill: var(--line); stroke: var(--ink-soft); stroke-width: 1; }   /* 今の人数に近くない会場 */
  .dot circle.hit { fill: var(--yellow); stroke: var(--ink); stroke-width: 1.5; }        /* 近い規模の上位 10 会場 */
  .dot circle.sel { fill: var(--primary); stroke: var(--ink); stroke-width: 2.5; }       /* 選んでいる会場 */
  .dot:focus { outline: none; } .dot:focus-visible circle { stroke: var(--ink); stroke-width: 6; }
  .side { display: grid; gap: 16px; align-content: start; padding: 24px; background: var(--bg-b); min-width: 0; }
  /* カード */
  .jcard { padding: 16px 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); min-width: 0; }
  .jlabel { display: flex; align-items: center; gap: 8px; margin: 0 0 16px; font-size: 14px; font-weight: 700; color: var(--ink-soft); }
  .jlabel i { display: grid; place-items: center; flex: none; width: 24px; height: 24px; border-radius: var(--radius); background: var(--primary); color: var(--surface); font-style: normal; font-size: 12px; }
  .jlabel .vname-s { margin-left: 4px; color: var(--ink); }
  .list-card { padding: 0; overflow: hidden; }
  .listhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 16px 16px 8px; }
  .listhead b { font-size: 16px; font-weight: 700; } .listhead span { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .vlist { display: grid; gap: 8px; max-height: 432px; overflow: auto; padding: 8px 16px 16px; }
  .vrow { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; align-items: center; min-height: 64px; padding: 8px 16px;
    border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
  .vrow:hover { background: var(--bg-b); border-color: var(--gray-300); }
  .vrow.sel { background: var(--bg-c); border-color: var(--primary); }   /* 選択: 面の色・青い線（太さ 4px の左線つき）。aria-selected も付く */
  .vrow:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  .cap { font-size: 20px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .cap small { display: block; font-size: 12px; color: var(--ink-soft); }
  .vname { font-size: 14px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
  .vmeta { font-size: 12px; font-weight: 400; color: var(--ink-soft); }
  .fit { display: inline-block; padding: 0 8px; border: 1px solid var(--gray-300); border-radius: var(--radius); background: var(--surface); color: var(--ink-soft); font-size: 12px; font-weight: 700; line-height: 22px; white-space: nowrap; }
  .fit.ok { border-color: var(--success); color: var(--success-ink); }
  .fit.small { border-color: var(--warning); color: var(--warning-ink); }
  .empty { padding: 16px; color: var(--ink-soft); font-size: 14px; }
  /* 会場の詳細 */
  .detail { display: grid; gap: 8px; }
  .dhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
  .dhead h2 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3; }
  .dbig { display: flex; align-items: baseline; gap: 4px; margin: 0; font-weight: 700; }
  .dbig .num { font-size: 28px; line-height: 1.2; color: var(--primary); }
  .dbig small { font-size: 16px; }
  .dbig .dtype { margin-left: 8px; padding: 0 8px; border-radius: var(--radius); background: var(--bg-c); color: var(--ink-soft); font-size: 12px; }
  details.fold-s[open] > summary { margin-bottom: 8px; }
  .kv { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 4px 8px; margin: 0; font-size: 14px; }
  .kv dt { color: var(--ink-soft); font-weight: 700; } .kv dd { margin: 0; overflow-wrap: anywhere; }
  .flag { font-size: 12px; color: var(--warning-ink); font-weight: 700; }
  .evs { display: grid; border-top: 1px solid var(--line); }
  .ev { display: grid; grid-template-columns: 7.2em minmax(0, 1fr); gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .ev .d { font-size: 12px; color: var(--ink-soft); padding-top: 2px; font-variant-numeric: tabular-nums; } .ev .a { font-weight: 700; } .ev .t { color: var(--ink-soft); font-size: 12px; }
  .g { display: inline-block; margin-left: 8px; padding: 0 8px; border-radius: var(--radius); background: var(--bg-c); color: var(--ink-soft); font-size: 12px; font-weight: 700; vertical-align: 1px; }
  /* 損益の試算 */
  #sim:empty { display: none; }
  .sim { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 24px; padding: 24px; border-top: 1px solid var(--line); background: var(--bg-b); }
  .grp { margin: 16px 0 8px; font-size: 14px; font-weight: 700; color: var(--ink); }
  .jlabel + .grp { margin-top: 0; }
  .inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(144px, 1fr)); gap: 8px 16px; }
  .inp { display: grid; gap: 4px; }
  .inp .il { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .inp input { width: 100%; min-height: var(--tap); padding: 4px 16px; border: 1px solid var(--ink-soft); border-radius: var(--radius); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 16px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .hint { font-size: 14px; color: var(--ink-soft); }
  .sim-in details.fold-s { margin-top: 16px; }
  .minline { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 16px; }
  .minline .big { font-size: 28px; font-weight: 700; line-height: 1.2; color: var(--primary); }
  .minline .sub { font-size: 16px; font-weight: 700; color: var(--ink-soft); }
  /* 判定の札（Success＝損益が合う／Warning＝今の需要では届かない／Error＝この会場では入りきらない）。白地・同系色の線・左にアイコン・文字は *-ink */
  .verdict { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .verdict b { display: inline-flex; align-items: center; gap: 8px; padding: 4px 16px 4px 8px; border: 1px solid var(--success); border-radius: var(--radius); background: var(--surface); color: var(--success-ink); font-size: 16px; font-weight: 700; line-height: 1.4; }
  .verdict b::before { content: "✓"; content: "✓" / ""; display: grid; place-items: center; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--success-ink); color: var(--surface); font-size: 14px; line-height: 1; }
  .verdict.warn b { border-color: var(--warning); color: var(--warning-ink); } .verdict.warn b::before { content: "!"; content: "!" / ""; background: var(--warning-ink); }
  .verdict.err b { border-color: var(--error); color: var(--error-ink); } .verdict.err b::before { content: "×"; content: "×" / ""; background: var(--error-ink); }
  .verdict span { font-size: 14px; color: var(--ink-soft); }

  /* 帯グラフ（区画は 2px の白い間をあけ、狭くて文字が入らない区画は文字を出さない） */
  .bars { display: grid; gap: 32px; padding: 40px 0 8px; }
  .barrow { display: grid; grid-template-columns: 6em minmax(0, 1fr); gap: 8px; align-items: center; font-size: 14px; font-weight: 700; color: var(--ink-soft); }
  .bar { position: relative; display: flex; height: 40px; border-radius: var(--radius); background: var(--bg-c); }
  .bar > .seg:first-child { border-radius: var(--radius) 0 0 var(--radius); }
  .seg { display: flex; flex-wrap: wrap; align-content: flex-start; align-items: center; justify-content: center; height: 100%; min-width: 0; padding: 0 4px; overflow: hidden;
    white-space: nowrap; font-size: 12px; font-weight: 700; color: var(--surface); }
  .seg::before { content: ""; flex: none; width: 0; height: 40px; }   /* 文字が入りきらないときは 2 行目に送られ、高さ 40px の外で切れて見えなくなる */
  .seg + .seg { border-left: 2px solid var(--surface); }
  .seg.c1 { background: var(--sky); color: var(--ink); } .seg.c2 { background: var(--primary-dark); }   /* 隣り合う区画どうしが 3:1 以上になる並び（濃・淡を交互に） */
  .seg.c3 { background: var(--sky-light); color: var(--ink); } .seg.c4 { background: var(--primary); }
  .seg.p  { background: var(--yellow); color: var(--ink); } .seg.f  { background: var(--primary); }
  .seg.u1 { background: var(--sky-light); color: var(--ink); } .seg.u2 { background: var(--primary-dark); }
  .line { position: absolute; top: -8px; bottom: -8px; border-left: 2px solid var(--ink); }
  .line span { position: absolute; bottom: 100%; left: -1px; margin-bottom: 4px; font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; }
  .line span::before { content: "▼ "; }
  .line.r span { left: auto; right: -1px; }   /* 線が右半分にあるときは、ラベルを線の左側に置く（はみ出して切れないように） */
  .line.r span::before { content: none; }
  .line.r span::after { content: " ▼"; }
  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; margin: 24px 0 16px; }
  .kpi { padding: 8px 16px; border-radius: var(--radius); background: var(--bg-c); }
  .kpi .k { display: block; font-size: 14px; }
  .kpi .v { display: block; font-size: 20px; font-weight: 700; line-height: 1.4; white-space: nowrap; }
  .kpi.main { display: block; grid-column: 1 / -1; order: -1; background: var(--primary); color: var(--surface); }
  .kpi.main .v { font-size: 28px; line-height: 1.3; } .kpi.main .k { color: var(--surface); }
  .sumtbl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; font-size: 14px; }
  .sumtbl .num { text-align: right; font-weight: 700; } .sumtbl .tot { font-weight: 700; border-top: 1px solid var(--line); padding-top: 4px; }
  .fold-note { padding: 16px 24px 24px; border-top: 1px solid var(--line); }
  .note { margin: 8px 0 0; font-size: 12px; color: var(--ink-soft); max-width: 80ch; }
  @media (max-width: 980px) {
    .main, .sim { grid-template-columns: 1fr; }
    .map-col { border-right: 0; border-bottom: 1px solid var(--line); }
  }
  @media (max-width: 640px) {
    .office-bar, .controls, .map-col, .side, .sim, .fold-note { padding-left: 16px; padding-right: 16px; }
    .jcard { padding: 16px; }
    .kpis { grid-template-columns: 1fr; }
    .part-h { font-size: 20px; }
    .minline .big { font-size: 28px; }
    .vrow { grid-template-columns: 56px minmax(0, 1fr); gap: 8px 16px; }
    .vrow .fit { grid-column: 2; justify-self: start; }
    .frow .k { min-width: 0; width: 100%; }
  }
  @media (prefers-reduced-motion: no-preference) { .dot circle { transition: r .25s ease, fill .25s ease, opacity .25s ease; } }
</style>
</head>
<body>
<div class="mock-banner" role="note"><span class="demo-chip">デモ用の架空データ</span>収支シミュレーター（数字は仮。デモ用）</div>

<header class="site-head">
  <div class="site-head-in">
    <img class="site-logo" src="assets/logo-wide.png" width="136" height="48" alt="OSHIYOBU">
    <a class="btn secondary sm" href="/">‹ 事務所向けに戻る</a>
  </div>
</header>

<div class="wrap">
  <h1 class="part-h">収支シミュレーター</h1>

  <div class="office">
    <div class="office-bar">
      <span class="bar-title">会場マップ</span>
      <span class="stats num" id="stats"></span>
      <div class="fake">需要と費用の数字は仮（デモ用）</div>
    </div>

    <section class="controls" aria-label="条件">
      <div class="people-row">
        <span class="k">人数</span>
        <div class="people"><input id="n" type="number" min="10" max="1500" step="10" value="300" aria-label="集まる人数"><span>人</span></div>
        <input id="nr" type="range" min="1" max="100" value="60" aria-label="人数のスライダー">
        <div class="chips" id="presets"></div>
      </div>
      <details class="adjust">
        <summary>絞り込み</summary>
        <div class="frow"><span class="k">県</span><div class="chips" id="prefs"></div></div>
        <div class="frow"><span class="k">種類</span><div class="chips" id="types"></div><button class="chip" id="onlyev" aria-pressed="true">公演の記録がある会場だけ</button></div>
        <div class="frow"><span class="k">過去の公演</span><div class="chips" id="genres"></div></div>
      </details>
    </section>

    <div class="main">
      <div class="map-col">
        <div class="map-wrap" id="mapbox"><svg id="map" role="img" aria-label="九州の会場の地図"></svg></div>
      </div>
      <div class="side">
        <section class="jcard list-card">
          <div class="listhead"><b id="lt"></b><span id="ls"></span></div>
          <div class="vlist" id="vlist" role="listbox" aria-label="近い規模の会場"></div>
        </section>
        <section class="jcard" id="detail" aria-live="polite"></section>
      </div>
    </div>

    <div id="sim"></div>

    <details class="fold-note">
      <summary>データについて</summary>
  <p class="note">収容人数と公演は、各行の出典URLで確認できたものだけを載せています。収容人数の一部はチケットサイトや会場紹介サイトの値です（会場ごとに表示）。地図の位置は住所の町丁目の代表点で、建物の位置とは少しずれます。データは2026年11月12日時点。</p>
    </details>
  </div>

const V = DATA.venues;

const TYPES = {livehouse:'ライブハウス',hall:'ホール',cafe_bar:'カフェ・バー',hotel_banquet:'ホテル宴会場',multipurpose:'多目的',arena:'アリーナ',other:'その他'};

const state = {n:300, prefs:new Set(PREFS), types:new Set(Object.keys(TYPES)), onlyEv:true, sel:null, genre:'all'};
// 仮置きの費用（区分ごと）。会場費は公開料金が分かる会場でも、まずはこの値から始める
const COST = {30:{venue:30000,prod:30000,fee:100000,travel:80000,profit:40000,price:7000},
              100:{venue:60000,prod:100000,fee:250000,travel:120000,profit:120000,price:7000},
              300:{venue:200000,prod:300000,fee:500000,travel:200000,profit:300000,price:6000},
              500:{venue:300000,prod:600000,fee:800000,travel:250000,profit:500000,price:7000},
              1000:{venue:600000,prod:1200000,fee:1500000,travel:350000,profit:1000000,price:7500}};
const sim = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// slider <-> people (log scale 10..1500)
const toN = v => Math.round(Math.exp(Math.log(10) + (Math.log(1500)-Math.log(10)) * v/100) / 10) * 10 || 10;
const toV = n => Math.round((Math.log(n)-Math.log(10)) / (Math.log(1500)-Math.log(10)) * 100);

function fit(cap, n){
  const r = cap / n;
  if (r < 0.9) return ['small','少し小さい'];
  if (r <= 1.6) return ['ok','ちょうど良い'];
  return ['big','大きい'];
}
function visible(v){
  return state.prefs.has(v.prefecture) && state.types.has(v.venue_type) && (!state.onlyEv || v.event_count > 0)
    && (state.genre === 'all' || v.events.some(e => e.genre === state.genre));
}
function ranked(){
  return V.filter(visible).map(v => ({v, s: Math.abs(Math.log(v.capacity / state.n)) + (v.capacity < state.n*0.9 ? 0.25 : 0)}))
          .sort((a,b) => a.s - b.s).map(x => x.v);
}

// ---------- map ----------
const M = MAP.meta, NS = 'http://www.w3.org/2000/svg';
const svg = $('#map'); svg.setAttribute('viewBox', `0 0 ${M.W} ${M.H}`);
function proj(lat, lng){
  const I = M.inset;
  if (lat < 29.5) return [I.x + (lng - I.AL0)/(I.AL1 - I.AL0)*I.w, I.y + (I.AA1 - lat)/(I.AA1 - I.AA0)*I.h];
  return [(lng - M.LO0)/(M.LO1 - M.LO0)*M.W, (M.LA1 - lat)/(M.LA1 - M.LA0)*M.H];
}
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; }
const gLand = el('g', {}, svg);
for (const p of PREFS) el('path', {d: MAP.paths[p], class:'land'}, gLand);
el('rect', {x:M.inset.x-6, y:M.inset.y-6, width:M.inset.w+12, height:M.inset.h+12, rx:8, class:'inset'}, svg);
const il = el('text', {x:M.inset.x, y:M.inset.y-12, class:'plab', style:'font-size:15px'}, svg); il.textContent = '奄美群島';
const LAB = {'福岡県':[33.62,130.75],'佐賀県':[33.33,130.08],'長崎県':[32.93,129.82],'熊本県':[32.62,130.92],'大分県':[33.18,131.38],'宮崎県':[32.2,131.2],'鹿児島県':[31.6,130.62]};
for (const p in LAB){ const [x,y] = proj(...LAB[p]); const t = el('text', {x, y, class:'plab', 'text-anchor':'middle'}, svg); t.textContent = p.replace('県',''); }
const gDots = el('g', {}, svg);
const DOT = {};
for (const v of V){
  if (v.lat == null) continue;
  const [x, y] = proj(v.lat, v.lng);
  const g = el('g', {class:'dot', tabindex:'0', role:'button', 'aria-label': v.venue_name}, gDots);
  const c = el('circle', {cx:x, cy:y, r:5}, g);
  const t = el('title', {}, g); t.textContent = `${v.venue_name}（${v.capacity}人）`;
  g.addEventListener('click', () => select(v.venue_id));
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(v.venue_id); } });
  DOT[v.venue_id] = {g, c};
}

// ---------- controls ----------
function chips(box, items, set, label){
  for (const [k, txt] of items){
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = txt; b.setAttribute('aria-pressed', 'true');
    b.addEventListener('click', () => { set.has(k) ? set.delete(k) : set.add(k); b.setAttribute('aria-pressed', set.has(k)); render(); });
    box.appendChild(b);
  }
}
chips($('#prefs'), PREFS.map(p => [p, p.replace('県','')]), state.prefs);
chips($('#types'), Object.entries(TYPES).filter(([k]) => V.some(v => v.venue_type === k)), state.types);
for (const n of [30,100,300,500,1000]){
  const b = document.createElement('button'); b.className = 'chip'; b.textContent = n + '人';
  b.addEventListener('click', () => setN(n)); $('#presets').appendChild(b);
}
{
  const cnt = {}; for (const v of V) for (const e of v.events) cnt[e.genre] = (cnt[e.genre]||0) + 1;
  const gs = [['all','すべて'], ...Object.keys(GENRE).filter(g => cnt[g]).map(g => [g, GENRE[g]])];
  const bs = [];
  for (const [g, txt] of gs){
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = txt; b.setAttribute('aria-pressed', g === 'all');
    b.addEventListener('click', () => { state.genre = g; bs.forEach(x => x.setAttribute('aria-pressed', x === b)); render(); });
    bs.push(b); $('#genres').appendChild(b);
  }
}
$('#onlyev').addEventListener('click', e => { state.onlyEv = !state.onlyEv; e.currentTarget.setAttribute('aria-pressed', state.onlyEv); render(); });
function setN(n){ n = Math.max(10, Math.min(1500, Math.round(+n || 10))); state.n = n; $('#n').value = n; $('#nr').value = toV(n); state.sel = null; render(); }
$('#n').addEventListener('change', e => setN(e.target.value));
$('#nr').addEventListener('input', e => setN(toN(+e.target.value)));

// ---------- render ----------
function render(){
  const list = ranked();
  const top = list.slice(0, 10);
  const topIds = new Set(top.map(v => v.venue_id));
  if (!state.sel || !list.some(v => v.venue_id === state.sel)) state.sel = top[0]?.venue_id ?? null;
  for (const v of V){
    const d = DOT[v.venue_id]; if (!d) continue;
    const vis = visible(v), hit = topIds.has(v.venue_id), sel = v.venue_id === state.sel;
    const r = 4 + Math.sqrt(v.capacity) * 0.38;
    d.c.setAttribute('r', sel ? r + 4 : r);
    d.c.setAttribute('class', sel ? 'sel' : hit ? 'hit' : 'dim');
    d.c.setAttribute('opacity', vis ? (hit || sel ? 1 : 0.8) : 0.12);
    d.g.style.display = vis ? '' : 'none';
    if (hit || sel) gDots.appendChild(d.g);
  }
  if (state.sel && DOT[state.sel]) gDots.appendChild(DOT[state.sel].g);
  $('#lt').textContent = `${state.n}人に近い会場`;
  $('#ls').textContent = `${list.length}会場中 上位${top.length}`;
  const box = $('#vlist'); box.innerHTML = '';
  if (!top.length){ box.innerHTML = '<div class="empty">条件に合う会場がありません。県や種類の選択を広げてください。</div>'; }
  for (const v of top){
    const [fc, ft] = fit(v.capacity, state.n);
    const row = document.createElement('div'); row.className = 'vrow' + (v.venue_id === state.sel ? ' sel' : '');
    row.tabIndex = 0; row.setAttribute('role', 'option'); row.setAttribute('aria-selected', v.venue_id === state.sel);
    row.innerHTML = `<div class="cap">${v.capacity.toLocaleString()}<small>人</small></div>
      <div><div class="vname">${esc(v.venue_name)}</div><div class="vmeta">${esc(v.prefecture.replace('県',''))}・${esc(v.city)}｜${esc(TYPES[v.venue_type]||v.venue_type)}｜公演 ${v.event_count}件</div></div>
      <span class="fit ${fc}">${ft}</span>`;
    row.addEventListener('click', () => select(v.venue_id));
    row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(v.venue_id); } });
    box.appendChild(row);
  }
  renderDetail(); renderSim();
  $('#stats').textContent = `${V.length}会場・${V.reduce((a,v)=>a+v.event_count,0)}公演`;
}
function select(id){
  state.sel = id;
  const v = V.find(x => x.venue_id === id);
  if (v && !visible(v)) { state.prefs.add(v.prefecture); }
  render();
}
function renderDetail(){
  const box = $('#detail');
  const v = V.find(x => x.venue_id === state.sel);
  if (!v){ box.innerHTML = '<div class="empty">地図の点か、上の一覧から会場を選ぶと、過去の公演が出ます。</div>'; return; }
  const geo = v.geo_precision === 'city' ? '<span class="flag">（位置は市の中心付近）</span>' : '';
  const off = /公式未確認|ticketjam|チケジャム|livefans|LiveFans|イープラス|e\+|RAG|WalkerPlus|concerthall|instabase|tabelog|食べログ|ライブハウス検索|live-events/i.test(v.capacity_basis + v.note) ? '<span class="flag">　公式以外の出典を含む</span>' : '';
  const evs = v.events.map(e => `<div class="ev"><div class="d">${esc(e.date)}</div><div>
      <span class="a">${esc(e.artist || '出演者の記載なし')}</span><span class="g">${esc(GENRE[e.genre] || e.genre || '')}</span>
      ${e.event_title ? `<div class="t">${esc(e.event_title)}</div>` : ''}
      <div class="t"><a href="${esc(e.source_url)}" target="_blank" rel="noopener">出典</a>${e.note ? '　' + esc(e.note) : ''}</div></div></div>`).join('');
  box.innerHTML = `<div class="detail">
    <div class="dhead"><h2>${esc(v.venue_name)}</h2><span class="vmeta">${esc(v.prefecture)} ${esc(v.city)}</span></div>
    <p class="dbig"><span class="num">${v.capacity.toLocaleString()}</span><small>人</small><span class="dtype">${esc(TYPES[v.venue_type] || v.venue_type)}</span></p>
    <details class="fold-s"><summary>会場の情報・出典</summary>
    <dl class="kv">
      <dt>収容人数</dt><dd><b>${v.capacity.toLocaleString()}人</b>　${esc(v.capacity_basis)}${off}　<a href="${esc(v.source_url)}" target="_blank" rel="noopener">出典</a></dd>
      <dt>種類</dt><dd>${esc(TYPES[v.venue_type] || v.venue_type)}</dd>
      ${v.address ? `<dt>住所</dt><dd>${esc(v.address)}${geo}</dd>` : ''}
      ${v.fee_note ? `<dt>利用料金</dt><dd>${esc(v.fee_note)}</dd>` : ''}
      ${v.official_url ? `<dt>公式</dt><dd><a href="${esc(v.official_url)}" target="_blank" rel="noopener">${esc(v.official_url)}</a></dd>` : ''}
      ${v.note ? `<dt>メモ</dt><dd class="vmeta">${esc(v.note)}</dd>` : ''}
    </dl></details>
    <details class="fold-s"><summary>過去の公演（${v.events.length}件・新しい順）</summary>
    <div class="evs">${evs || '<div class="empty">公演の記録はまだありません。</div>'}</div></details></div>`;
}
const yen = x => Math.round(x).toLocaleString() + '円';
const man = x => (x >= 10000 ? (Math.round(x/1000)/10).toLocaleString() + '万円' : Math.round(x).toLocaleString() + '円');
function simFor(v){
  if (!sim[v.venue_id]){
    const c = COST[v.capacity_tier];
    const fr = Math.max(4, Math.round(v.capacity * 0.1));
    sim[v.venue_id] = {venue:c.venue, prod:c.prod, fee:c.fee, travel:c.travel, profit:c.profit, price:c.price,
      demand: Math.round(v.capacity * 1.3),
      t1n: fr, t1p: c.price * 2, t2n: Math.max(2, Math.round(fr / 2)), t2p: c.price * 4};
  }
  return sim[v.venue_id];
}
function renderSim(){
  const box = $('#sim');
  const v = V.find(x => x.venue_id === state.sel);
  if (!v){ box.innerHTML = ''; return; }
  const s = simFor(v);
  const F = [['venue','会場費'],['prod','制作費'],['fee','出演料'],['travel','移動・宿泊'],['profit','アーティストの利益'],['price','チケット価格']];
  const U = [['t1n','前方席の数'],['t1p','前方席の上乗せ'],['t2n','あいさつの数'],['t2p','あいさつの上乗せ']];
  const inp = (k, l) => `<label class="inp"><span class="il">${l}</span><input id="s-${k}" type="number" min="0" step="1000" value="${s[k]}"></label>`;
  box.innerHTML = `<div class="sim">
    <section class="jcard sim-in">
      <p class="jlabel"><i>1</i>数字</p>
      <div class="grp">費用と利益</div><div class="inputs">${F.map(([k,l]) => inp(k,l)).join('')}</div>
      <div class="grp">需要（仮）</div><div class="inputs">${inp('demand','推しを登録し、預金している人')}</div>
      <div class="grp">高い枠</div><div class="inputs">${U.map(([k,l]) => inp(k,l)).join('')}</div>
      <details class="fold-s"><summary>前提</summary>
      <div class="hint">数字はすべて仮置き。アーティスト側と話しながら、実際の値に書き換えて使う。${v.fee_note ? '<br>公開されている会場の料金：' + esc(v.fee_note) : ''}<br>需要（デモ用の仮の数字。本番は預金つきの登録者数）。上に積む枠（クラファンの高い枠）。この街で推しを登録し、預金している人。</div></details>
    </section>
    <section class="jcard sim-out"><p class="jlabel"><i>2</i>損益<span class="vname-s">${esc(v.venue_name)}</span></p><div id="simout"></div></section>
  </div>`;
  for (const k of [...F, ...U, ['demand']].map(x => x[0])){
    $('#s-' + k).addEventListener('input', e => { s[k] = Math.max(0, +e.target.value || 0); simOut(v, s); });
  }
  simOut(v, s);
}
function simOut(v, s){
  const cost = s.venue + s.prod + s.fee + s.travel;
  const line = cost + s.profit;
  const up1 = s.t1n * s.t1p, up2 = s.t2n * s.t2p, up = up1 + up2;
  const need = s.price > 0 ? Math.ceil(line / s.price) : Infinity;   // 通常の席だけで最低条件に届く人数
  const fits = v.capacity * s.price + up >= line;
  const seats = Math.min(v.capacity, s.demand);
  const reach = seats * s.price;
  const total = reach + up;
  const ok = fits && total >= line;
  const fee = total * 0.10;
  const artistProfit = Math.max(0, total - fee - cost);
  const max = Math.max(total, line) * 1.04;
  const w = x => (100 * x / max).toFixed(2) + '%';
  const seg = (cls, x, lab) => x > 0 ? `<div class="seg ${cls}" style="width:${w(x)}" title="${lab} ${man(x)}">${lab}</div>` : '';
  const verdict = !fits
    ? `<div class="verdict err"><b>この会場では入りきらない</b><span>満席と上の枠を合わせても、最低条件に届かない。価格を上げるか、大きい会場へ</span></div>`
    : ok ? `<div class="verdict ok"><b>損益が合う：All-or-Nothingで提案できる</b><span>通常の席が ${Math.min(need, v.capacity).toLocaleString()}人（収容の${Math.min(100, Math.round(100*need/v.capacity))}%）埋まれば、最低条件に届く。需要は ${s.demand.toLocaleString()}人</span></div>`
         : `<div class="verdict warn"><b>今の需要では届かない</b><span>最低条件まで あと ${man(line - total)}。届かなければ不成立で、誰も損をしない</span></div>`;
  $('#simout').innerHTML = `<div class="minline"><span class="k">最低条件</span><span class="big num">${yen(line)}</span>${Number.isFinite(need) ? `<span class="sub num">${need.toLocaleString()}人 × ${yen(s.price)}</span>` : ''}</div>
    ${verdict}
    <div class="bars">
      <div class="barrow"><span>費用と目標</span><div class="bar">
        ${seg('c1', s.venue, '会場')}${seg('c2', s.prod, '制作')}${seg('c3', s.fee, '出演料')}${seg('c4', s.travel, '移動')}${seg('p', s.profit, '利益')}
        <div class="line${parseFloat(w(line)) > 50 ? ' r' : ''}" style="left:${w(line)}"><span>最低条件 ${man(line)}</span></div></div></div>
      <div class="barrow"><span>集まるお金</span><div class="bar">
        ${seg('f', reach, '通常の席 ' + seats.toLocaleString() + '人')}${seg('u1', up1, '前方席')}${seg('u2', up2, 'あいさつ')}
        <div class="line" style="left:${w(line)}"></div></div></div>
    </div>
    <div class="kpis">
      <div class="kpi"><span class="k">集まる合計</span><span class="v num">${yen(total)}</span></div>
      <div class="kpi"><span class="k">手数料（10%）</span><span class="v num">${ok ? yen(fee) : '0円（不成立）'}</span></div>
      <div class="kpi main"><span class="k">アーティストの利益</span><span class="v num">${ok ? yen(artistProfit) : '0円（不成立）'}</span></div>
    </div>
    <details class="fold-s"><summary>内訳</summary>
    <div class="sumtbl">
      <span>最低条件（All-or-Nothingの目標）</span><span class="num">${yen(line)}</span>
      <span>通常の席で集まる額（${seats.toLocaleString()}人 × ${yen(s.price)}）</span><span class="num">${yen(reach)}</span>
      <span>上に積む枠（前方席 ${s.t1n}・あいさつ ${s.t2n}）</span><span class="num">${yen(up)}</span>
      <span>集まる合計</span><span class="num">${yen(total)}</span>
      <span>OSHIYOBUの成立手数料（10%）</span><span class="num">${ok ? yen(fee) : '0円（不成立）'}</span>
      <span class="tot">アーティスト側の利益</span><span class="num tot">${ok ? yen(artistProfit) : '0円（不成立）'}</span>
    </div></details>`;
}
setN(300);
</script>
</body>
</html>
